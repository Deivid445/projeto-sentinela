<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Hospitalar - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h2>🏥 Sistema Hospitalar</h2>
    <input id="usuario" placeholder="Usuário">
    <input id="senha" type="password" placeholder="Senha">
    <button onclick="login()">Entrar</button>
</div>

<script>
function login() {
    const usuarioVal = document.getElementById("usuario").value;
    const senhaVal = document.getElementById("senha").value;

    fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            usuario: usuarioVal,
            senha: senhaVal
        })
    })
    .then(async r => {
        if (!r.ok) {
            throw new Error("Usuário ou senha incorretos");
        }
        return r.json();
    })
    .then(data => {
        // Pega o tipo tanto se vier direto 'data.tipo' quanto se o servidor responder 'data'
        const tipo = data.tipo;

        if (tipo === "triagem") location.href = "triagem.html";
        else if (tipo === "medico") location.href = "medico.html";
        else if (tipo === "atendimento") location.href = "atendimento.html";
        else if (tipo === "alta") location.href = "alta.html";
        else if (tipo === "medicacoes") location.href = "medicacoes.html";
        else alert("Perfil de usuário não identificado.");
    })
    .catch(err => {
        alert("Usuário ou senha incorretos / perfil não identificado.");
    });
}
</script>
</body>
</html>
